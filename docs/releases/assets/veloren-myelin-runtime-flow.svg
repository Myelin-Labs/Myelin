<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" role="img" aria-labelledby="title desc">
  <title id="title">How a Veloren event becomes finalised Myelin history</title>
  <desc id="desc">A continuous illustrated event rail with no flow arrows. Veloren filters game activity through a funnel and appends selected events to a sequenced SQLite journal. Myelin ProductionSchedule accumulates those events inside a one hundred millisecond Open window or until one thousand and twenty-four events fill the batch. A background worker carries the fixed event range across a narrow versioned bridge. The session runtime bounds the candidate, CKB-VM verifies its finite state transition, configured finality seals the exact result, and RocksDB atomically stores the block, snapshot, and session head. A separate dashed cursor line links the committed sequence back to the journal for recovery.</desc>
  <defs>
    <linearGradient id="teal-soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AACECF"/>
      <stop offset="1" stop-color="#F4F5F4"/>
    </linearGradient>
    <style>
      .title{font:700 54px 'Noto Sans',sans-serif;letter-spacing:.4px;fill:#031E32}
      .subtitle{font:600 25px 'Noto Sans',sans-serif;fill:#1F9795}
      .owner{font:700 19px 'Noto Sans',sans-serif;letter-spacing:1.8px;fill:#031E32}
      .boundary{font:700 14px 'Noto Sans',sans-serif;letter-spacing:1.4px;fill:#1F9795}
      .stage{font:700 20px 'Noto Sans',sans-serif;fill:#031E32}
      .body{font:500 16px 'Noto Sans',sans-serif;fill:#031E32}
      .small{font:600 13px 'Noto Sans',sans-serif;fill:#031E32}
      .tiny{font:600 12px 'Noto Sans',sans-serif;letter-spacing:.4px;fill:#637780}
      .teal{font:700 13px 'Noto Sans',sans-serif;letter-spacing:.5px;fill:#1F9795}
      .light{font:700 18px 'Noto Sans',sans-serif;fill:#F4F5F4}
      .rail-note{font:600 15px 'Noto Sans',sans-serif;fill:#031E32}
      .footer{font:600 20px 'Noto Sans',sans-serif;fill:#031E32}
    </style>
  </defs>

  <rect width="2000" height="1100" fill="#FFFFFF"/>
  <text x="1000" y="80" text-anchor="middle" class="title">HOW A VELOREN EVENT BECOMES MYELIN HISTORY</text>
  <text x="1000" y="128" text-anchor="middle" class="subtitle">Select what matters · close one finite batch · preserve one exact result</text>

  <text x="80" y="195" class="owner">VELOREN HOST</text>
  <line x1="80" y1="212" x2="945" y2="212" stroke="#1F9795" stroke-width="3"/>
  <text x="1130" y="195" class="owner">MYELIN RUNTIME</text>
  <line x1="1130" y1="212" x2="1920" y2="212" stroke="#1F9795" stroke-width="3"/>
  <line x1="1015" y1="180" x2="1015" y2="545" stroke="#AACECF" stroke-width="2" stroke-dasharray="7 9"/>
  <rect x="928" y="178" width="174" height="31" fill="#FFFFFF"/>
  <text x="1015" y="199" text-anchor="middle" class="boundary">NARROW ADAPTER</text>

  <!-- One continuous event rail. Numbered stations carry direction; no arrowheads. -->
  <line x1="80" y1="565" x2="1920" y2="565" stroke="#AACECF" stroke-width="10" stroke-linecap="round"/>
  <g fill="#1F9795">
    <rect x="295" y="556" width="22" height="18" rx="4"/>
    <rect x="600" y="556" width="22" height="18" rx="4"/>
    <rect x="900" y="556" width="22" height="18" rx="4"/>
    <rect x="1110" y="556" width="22" height="18" rx="4"/>
    <rect x="1410" y="556" width="22" height="18" rx="4"/>
    <rect x="1670" y="556" width="22" height="18" rx="4"/>
  </g>

  <!-- 1. Event selection is shown as a funnel, not a box. -->
  <g>
    <g fill="#A0A8AF">
      <circle cx="88" cy="278" r="9"/><circle cx="174" cy="278" r="9"/><circle cx="260" cy="278" r="9"/>
    </g>
    <text x="88" y="257" text-anchor="middle" class="tiny">move</text>
    <text x="174" y="257" text-anchor="middle" class="tiny">render</text>
    <text x="260" y="257" text-anchor="middle" class="tiny">tick</text>
    <g fill="#1F9795">
      <circle cx="112" cy="323" r="11"/><circle cx="174" cy="323" r="11"/><circle cx="236" cy="323" r="11"/>
    </g>
    <text x="112" y="304" text-anchor="middle" class="small">login</text>
    <text x="174" y="304" text-anchor="middle" class="small">asset</text>
    <text x="236" y="304" text-anchor="middle" class="small">trade</text>
    <path d="M72 354h204l-57 102v71h-90v-71z" fill="url(#teal-soft)" stroke="#031E32" stroke-width="3" stroke-linejoin="round"/>
    <path d="M102 386h144M119 418h110" stroke="#1F9795" stroke-width="3" stroke-linecap="round"/>
    <g fill="#1F9795">
      <rect x="145" y="460" width="15" height="15" rx="3"/><rect x="169" y="482" width="15" height="15" rx="3"/><rect x="193" y="504" width="15" height="15" rx="3"/>
    </g>
    <line x1="174" y1="527" x2="174" y2="565" stroke="#031E32" stroke-width="4"/>
  </g>

  <!-- 2. Sequenced journal. -->
  <g>
    <text x="445" y="300" text-anchor="middle" class="teal">SQLITE · APPEND BEFORE MUTATION</text>
    <rect x="360" y="343" width="178" height="112" fill="#FFFFFF" stroke="#031E32" stroke-width="3"/>
    <rect x="374" y="360" width="178" height="112" fill="#F4F5F4" stroke="#031E32" stroke-width="3"/>
    <rect x="388" y="377" width="178" height="112" fill="url(#teal-soft)" stroke="#1F9795" stroke-width="3"/>
    <line x1="416" y1="410" x2="514" y2="410" stroke="#1F9795" stroke-width="4"/>
    <line x1="416" y1="438" x2="526" y2="438" stroke="#1F9795" stroke-width="4"/>
    <line x1="416" y1="466" x2="495" y2="466" stroke="#1F9795" stroke-width="4"/>
    <text x="542" y="414" text-anchor="end" class="small">n</text>
    <text x="542" y="442" text-anchor="end" class="small">…</text>
    <text x="542" y="470" text-anchor="end" class="small">m</text>
    <line x1="477" y1="489" x2="477" y2="565" stroke="#031E32" stroke-width="4"/>
  </g>

  <!-- 3. A real window: first event opens, deadline or capacity closes. -->
  <g>
    <text x="753" y="244" text-anchor="middle" class="teal">MYELIN PRODUCTION SCHEDULE</text>
    <path d="M666 270h146l28 28v62H666z" fill="#FFFFFF" stroke="#1F9795" stroke-width="2.5"/>
    <path d="M812 270v28h28" fill="none" stroke="#1F9795" stroke-width="2.5"/>
    <text x="753" y="318" text-anchor="middle" class="small">myelin.json</text>
    <line x1="753" y1="360" x2="753" y2="395" stroke="#1F9795" stroke-width="3"/>

    <line x1="638" y1="465" x2="862" y2="465" stroke="#031E32" stroke-width="4" stroke-linecap="round"/>
    <circle cx="650" cy="465" r="10" fill="#1F9795"/>
    <circle cx="706" cy="465" r="10" fill="#1F9795"/>
    <circle cx="762" cy="465" r="10" fill="#1F9795"/>
    <circle cx="818" cy="465" r="10" fill="#1F9795"/>
    <line x1="862" y1="397" x2="862" y2="525" stroke="#1F9795" stroke-width="6" stroke-linecap="round"/>
    <path d="M650 417v-20h212v20" fill="none" stroke="#AACECF" stroke-width="3"/>
    <text x="756" y="385" text-anchor="middle" class="small">100 ms after first event</text>
    <text x="862" y="553" text-anchor="middle" class="teal">OR 1,024 EVENTS</text>
    <line x1="753" y1="465" x2="753" y2="565" stroke="#031E32" stroke-width="4"/>
  </g>

  <!-- 4. A literal bridge carries one fixed sequence range over the adapter boundary. -->
  <g>
    <circle cx="1015" cy="315" r="43" fill="#FFFFFF" stroke="#1F9795" stroke-width="4"/>
    <line x1="1015" y1="315" x2="1015" y2="286" stroke="#031E32" stroke-width="4" stroke-linecap="round"/>
    <line x1="1015" y1="315" x2="1038" y2="328" stroke="#031E32" stroke-width="4" stroke-linecap="round"/>
    <text x="1015" y="378" text-anchor="middle" class="small">background worker</text>
    <path d="M920 510h190M930 510q85-118 170 0M943 510v48M1087 510v48" fill="none" stroke="#031E32" stroke-width="4" stroke-linecap="round"/>
    <g>
      <rect x="954" y="478" width="34" height="28" rx="4" fill="#1F9795"/>
      <rect x="996" y="478" width="34" height="28" rx="4" fill="#1F9795"/>
      <rect x="1038" y="478" width="34" height="28" rx="4" fill="#1F9795"/>
      <text x="971" y="498" text-anchor="middle" class="small">n</text>
      <text x="1013" y="498" text-anchor="middle" class="small">…</text>
      <text x="1055" y="498" text-anchor="middle" class="small">m</text>
    </g>
    <text x="1015" y="449" text-anchor="middle" class="teal">FIXED EVENT RANGE</text>
  </g>

  <!-- 5. Session bounds wrap a VM chip; pre- and post-roots sit on the same rail. -->
  <g>
    <path d="M1158 330h-30v214h30M1392 330h30v214h-30" fill="none" stroke="#1F9795" stroke-width="3"/>
    <text x="1275" y="310" text-anchor="middle" class="teal">SESSION RUNTIME · COUNT + BYTE LIMITS</text>
    <g fill="#031E32">
      <rect x="1192" y="375" width="166" height="142" rx="14"/>
      <rect x="1176" y="394" width="16" height="12"/><rect x="1176" y="425" width="16" height="12"/><rect x="1176" y="456" width="16" height="12"/><rect x="1176" y="487" width="16" height="12"/>
      <rect x="1358" y="394" width="16" height="12"/><rect x="1358" y="425" width="16" height="12"/><rect x="1358" y="456" width="16" height="12"/><rect x="1358" y="487" width="16" height="12"/>
    </g>
    <text x="1275" y="432" text-anchor="middle" class="light">CKB-VM</text>
    <text x="1275" y="464" text-anchor="middle" class="small" fill="#F4F5F4">script groups</text>
    <text x="1275" y="491" text-anchor="middle" class="small" fill="#F4F5F4">finite cycles</text>
    <line x1="1275" y1="517" x2="1275" y2="565" stroke="#031E32" stroke-width="4"/>
    <circle cx="1150" cy="565" r="18" fill="#FFFFFF" stroke="#1F9795" stroke-width="4"/>
    <circle cx="1400" cy="565" r="18" fill="#FFFFFF" stroke="#1F9795" stroke-width="4"/>
    <text x="1150" y="571" text-anchor="middle" class="small">Sₕ</text>
    <text x="1400" y="571" text-anchor="middle" class="small">Sₕ₊₁</text>
  </g>

  <!-- 6. Three configured trust arrangements seal the exact result. -->
  <g>
    <line x1="1515" y1="338" x2="1570" y2="438" stroke="#AACECF" stroke-width="4"/>
    <line x1="1570" y1="338" x2="1570" y2="438" stroke="#AACECF" stroke-width="4"/>
    <line x1="1625" y1="338" x2="1570" y2="438" stroke="#AACECF" stroke-width="4"/>
    <circle cx="1515" cy="326" r="28" fill="#FFFFFF" stroke="#1F9795" stroke-width="4"/>
    <circle cx="1570" cy="326" r="28" fill="#FFFFFF" stroke="#1F9795" stroke-width="4"/>
    <circle cx="1625" cy="326" r="28" fill="#FFFFFF" stroke="#1F9795" stroke-width="4"/>
    <text x="1515" y="332" text-anchor="middle" class="small">P</text>
    <text x="1570" y="332" text-anchor="middle" class="small">C</text>
    <text x="1625" y="332" text-anchor="middle" class="small">T</text>
    <circle cx="1570" cy="448" r="52" fill="#1F9795"/>
    <path d="M1545 448l17 18 33-39" fill="none" stroke="#031E32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1570" y="527" text-anchor="middle" class="teal">VERIFY EXACT BLOCK</text>
    <line x1="1570" y1="500" x2="1570" y2="565" stroke="#031E32" stroke-width="4"/>
  </g>

  <!-- 7. Durable history is a visible stack, not another process card. -->
  <g>
    <ellipse cx="1825" cy="344" rx="92" ry="31" fill="#AACECF" stroke="#031E32" stroke-width="3"/>
    <path d="M1733 344v162c0 17 41 31 92 31s92-14 92-31V344" fill="url(#teal-soft)" stroke="#031E32" stroke-width="3"/>
    <ellipse cx="1825" cy="398" rx="92" ry="31" fill="none" stroke="#1F9795" stroke-width="3"/>
    <ellipse cx="1825" cy="452" rx="92" ry="31" fill="none" stroke="#1F9795" stroke-width="3"/>
    <ellipse cx="1825" cy="506" rx="92" ry="31" fill="none" stroke="#1F9795" stroke-width="3"/>
    <text x="1825" y="351" text-anchor="middle" class="small">block</text>
    <text x="1825" y="405" text-anchor="middle" class="small">snapshot</text>
    <text x="1825" y="459" text-anchor="middle" class="small">head</text>
    <text x="1825" y="525" text-anchor="middle" class="teal">ATOMIC</text>
    <line x1="1825" y1="537" x2="1825" y2="565" stroke="#031E32" stroke-width="4"/>
  </g>

  <!-- Station labels. -->
  <g>
    <circle cx="174" cy="625" r="20" fill="#1F9795"/><text x="174" y="632" text-anchor="middle" class="step">1</text>
    <text x="174" y="669" text-anchor="middle" class="stage">SELECT</text>
    <text x="174" y="697" text-anchor="middle" class="body">authoritative events only</text>

    <circle cx="477" cy="625" r="20" fill="#1F9795"/><text x="477" y="632" text-anchor="middle" class="step">2</text>
    <text x="477" y="669" text-anchor="middle" class="stage">JOURNAL</text>
    <text x="477" y="697" text-anchor="middle" class="body">durable sequence n … m</text>

    <circle cx="753" cy="625" r="20" fill="#1F9795"/><text x="753" y="632" text-anchor="middle" class="step">3</text>
    <text x="753" y="669" text-anchor="middle" class="stage">CLOSE</text>
    <text x="753" y="697" text-anchor="middle" class="body">due or full · idle stays idle</text>

    <circle cx="1015" cy="625" r="20" fill="#1F9795"/><text x="1015" y="632" text-anchor="middle" class="step">4</text>
    <text x="1015" y="669" text-anchor="middle" class="stage">HAND OFF</text>
    <text x="1015" y="697" text-anchor="middle" class="body">worker + versioned bridge</text>

    <circle cx="1275" cy="625" r="20" fill="#AACECF"/><text x="1275" y="632" text-anchor="middle" class="step">5</text>
    <text x="1275" y="669" text-anchor="middle" class="stage">EXECUTE</text>
    <text x="1275" y="697" text-anchor="middle" class="body">bounded CellTx transition</text>

    <circle cx="1570" cy="625" r="20" fill="#AACECF"/><text x="1570" y="632" text-anchor="middle" class="step">6</text>
    <text x="1570" y="669" text-anchor="middle" class="stage">FINALISE</text>
    <text x="1570" y="697" text-anchor="middle" class="body">PoA · Committee · Tendermint</text>

    <circle cx="1825" cy="625" r="20" fill="#AACECF"/><text x="1825" y="632" text-anchor="middle" class="step">7</text>
    <text x="1825" y="669" text-anchor="middle" class="stage">COMMIT</text>
    <text x="1825" y="697" text-anchor="middle" class="body">block · snapshot · head</text>
  </g>

  <!-- Recovery has endpoints and words, not another directional arrow. -->
  <line x1="477" y1="824" x2="1825" y2="824" stroke="#1F9795" stroke-width="3" stroke-dasharray="10 9"/>
  <line x1="477" y1="714" x2="477" y2="824" stroke="#1F9795" stroke-width="3" stroke-dasharray="10 9"/>
  <line x1="1825" y1="714" x2="1825" y2="824" stroke="#1F9795" stroke-width="3" stroke-dasharray="10 9"/>
  <circle cx="477" cy="824" r="10" fill="#FFFFFF" stroke="#1F9795" stroke-width="4"/>
  <circle cx="1825" cy="824" r="10" fill="#1F9795"/>
  <text x="477" y="858" text-anchor="middle" class="rail-note">journal cursor = m</text>
  <text x="1825" y="858" text-anchor="middle" class="rail-note">commit sequence m</text>
  <text x="1151" y="809" text-anchor="middle" class="teal">FINALISED SEQUENCE ADVANCES · EVENTS AFTER m REMAIN RECOVERABLE</text>

  <line x1="80" y1="935" x2="1920" y2="935" stroke="#AACECF" stroke-width="2"/>
  <text x="1000" y="981" text-anchor="middle" class="footer">Veloren decides what matters. Myelin preserves how it became history.</text>
</svg>
