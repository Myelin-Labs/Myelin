<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Four block-production trigger policies in Fuel Core and Myelin</title>
  <desc id="desc">Instant closes on transaction arrival, Interval closes on a fixed tick, Open accumulates work until a deadline, and Never leaves production to manual requests. Myelin now implements all four behind a bounded reserving source.</desc>
  <defs>
    <style>
      .eyebrow{font:650 17px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:4px;fill:#55BFC0}
      .title{font:650 44px Inter,ui-sans-serif,system-ui,sans-serif;fill:#F4F0E8}
      .mode{font:700 25px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0B1F2A}
      .body{font:450 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0B1F2A}
      .small{font:650 15px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1px}
      .status{font:600 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#0B1F2A}
      .foot{font:500 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#F4F0E8}
    </style>
  </defs>

  <rect width="1600" height="880" rx="28" fill="#0B1F2A"/>
  <text x="80" y="72" class="eyebrow">A FUEL CORE LESSON, NOW A MYELIN MODULE</text>
  <text x="80" y="130" class="title">The trigger closes the window</text>

  <g transform="translate(70 205)">
    <rect width="350" height="420" rx="28" fill="#F4F0E8"/>
    <rect x="28" y="28" width="112" height="34" rx="17" fill="#55BFC0"/>
    <text x="84" y="51" text-anchor="middle" class="small" fill="#0B1F2A">ARRIVAL</text>
    <text x="28" y="112" class="mode">Instant</text>
    <text x="28" y="148" class="body">Close when work appears.</text>
    <g transform="translate(50 220)">
      <circle cx="28" cy="48" r="15" fill="#55BFC0"/>
      <path d="M52 48h110" stroke="#0B1F2A" stroke-width="5" stroke-linecap="round"/>
      <path d="M150 34l20 14-20 14" fill="none" stroke="#0B1F2A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="190" y="16" width="70" height="64" rx="15" fill="#0B1F2A"/>
      <rect x="210" y="35" width="30" height="26" rx="6" fill="#55BFC0"/>
    </g>
    <text x="28" y="382" class="small" fill="#0B1F2A">LOW LATENCY</text>
  </g>

  <g transform="translate(440 205)">
    <rect width="350" height="420" rx="28" fill="#F4F0E8"/>
    <rect x="28" y="28" width="112" height="34" rx="17" fill="#55BFC0"/>
    <text x="84" y="51" text-anchor="middle" class="small" fill="#0B1F2A">CLOCK</text>
    <text x="28" y="112" class="mode">Interval</text>
    <text x="28" y="148" class="body">Close on each fixed tick.</text>
    <g transform="translate(38 220)">
      <path d="M10 48h264" stroke="#0B1F2A" stroke-width="5" stroke-linecap="round"/>
      <g fill="#55BFC0">
        <rect x="28" y="18" width="54" height="60" rx="13"/>
        <rect x="110" y="18" width="54" height="60" rx="13"/>
        <rect x="192" y="18" width="54" height="60" rx="13"/>
      </g>
      <g class="small" fill="#0B1F2A" text-anchor="middle">
        <text x="55" y="55">T</text><text x="137" y="55">T+Δ</text><text x="219" y="55">T+2Δ</text>
      </g>
    </g>
    <text x="28" y="382" class="small" fill="#0B1F2A">EMPTY BLOCKS ALLOWED</text>
  </g>

  <g transform="translate(810 205)">
    <rect width="350" height="420" rx="28" fill="#F4F0E8"/>
    <rect x="28" y="28" width="112" height="34" rx="17" fill="#55BFC0"/>
    <text x="84" y="51" text-anchor="middle" class="small" fill="#0B1F2A">DEADLINE</text>
    <text x="28" y="112" class="mode">Open</text>
    <text x="28" y="148" class="body">Gather until full or due.</text>
    <g transform="translate(42 215)">
      <path d="M8 20v88M260 20v88M8 64h252" stroke="#0B1F2A" stroke-width="5" stroke-linecap="round"/>
      <g fill="#55BFC0">
        <circle cx="55" cy="64" r="13"/><circle cx="105" cy="64" r="13"/><circle cx="155" cy="64" r="13"/><circle cx="205" cy="64" r="13"/>
      </g>
    </g>
    <text x="28" y="382" class="small" fill="#0B1F2A">CUMULATIVE BATCH</text>
  </g>

  <g transform="translate(1180 205)">
    <rect width="350" height="420" rx="28" fill="#F4F0E8"/>
    <rect x="28" y="28" width="112" height="34" rx="17" fill="#55BFC0"/>
    <text x="84" y="51" text-anchor="middle" class="small" fill="#0B1F2A">OPERATOR</text>
    <text x="28" y="112" class="mode">Never</text>
    <text x="28" y="148" class="body">Wait for an explicit request.</text>
    <g transform="translate(55 218)">
      <circle cx="54" cy="55" r="45" fill="#0B1F2A"/>
      <path d="M42 37v36M66 37v36" stroke="#55BFC0" stroke-width="9" stroke-linecap="round"/>
      <path d="M119 55h95" stroke="#0B1F2A" stroke-width="5" stroke-linecap="round"/>
      <path d="M202 41l20 14-20 14" fill="none" stroke="#0B1F2A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="28" y="382" class="small" fill="#0B1F2A">MANUAL CONTROL</text>
  </g>

  <g transform="translate(70 690)">
    <rect width="1460" height="72" rx="24" fill="#55BFC0"/>
    <text x="730" y="45" text-anchor="middle" class="status">Myelin ships all four · bounded batches · reservations · one writer</text>
  </g>
  <text x="800" y="825" text-anchor="middle" class="foot">Execution · finality · durable commitment remain separate</text>
</svg>
