name: CellScript integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev jq
      - name: Test independent adapter workspace
        run: cargo test --locked --manifest-path integrations/cellscript/Cargo.toml
      - name: Reproduce compiler and export generic manifests
        env:
          CELLSCRIPT_TOOLCHAIN_ROOT: ${{ runner.temp }}/cellscript-toolchain
          CELLSCRIPT_EVIDENCE_ROOT: ${{ runner.temp }}/cellscript-evidence
        run: integrations/cellscript/scripts/reproduce-compiler.sh
      - name: Retain integration handoff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cellscript-integration-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cellscript-evidence
          if-no-files-found: error
          retention-days: 7
