[package]
name = "myelin-cellscript-adapter"
version = "0.20.0"
edition = "2021"
license = "MIT"
description = "Fail-closed process adapter from Myelin to a pinned CellScript compiler"

[dependencies]
blake3.workspace = true
hex.workspace = true
myelin-exec.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "myelin-cellscript-adapter"
path = "src/main.rs"
