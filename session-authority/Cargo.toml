[package]
name = "myelin-session-authority"
version = "0.31.0"
edition = "2021"
license = "MIT"
description = "Explicit single-authority epoch fencing for canonical Myelin writes and effects"

[features]
default = []
test-fixture = []

[dependencies]
blake3.workspace = true
myelin-consensus.workspace = true
myelin-session.workspace = true
myelin-session-network.workspace = true
myelin-session-runtime.workspace = true
myelin-session-store-rocksdb.workspace = true
postcard.workspace = true
prost.workspace = true
rand.workspace = true
rocksdb.workspace = true
secp256k1.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
myelin-session-journal.workspace = true
myelin-session-transfer.workspace = true
tempfile.workspace = true

[lints]
workspace = true
